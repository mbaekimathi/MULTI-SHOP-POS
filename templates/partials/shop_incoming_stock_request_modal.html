{# Incoming stock request Accept/Decline popup — polled on any shop page (and POS). #}
{% if shop and notification_bell_visible %}
<div
  id="pos-incoming-sr-modal"
  class="fixed inset-0 z-[96] hidden"
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-labelledby="pos-incoming-sr-title"
>
  <div id="pos-incoming-sr-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
  <div class="absolute inset-0 flex items-center justify-center p-3 sm:p-4">
    <div
      class="w-full max-w-md rounded-2xl border border-[rgb(var(--rc-border))] bg-[rgb(var(--rc-surface))] p-5 shadow-2xl ring-1 ring-[rgb(var(--rc-primary))]/20"
    >
      <div class="flex items-start gap-3">
        <div
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[rgb(var(--rc-primary))]/15 text-[rgb(var(--rc-primary))]"
          aria-hidden="true"
        >
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"
            />
          </svg>
        </div>
        <div class="min-w-0 flex-1">
          <h3 id="pos-incoming-sr-title" class="text-base font-bold text-[rgb(var(--rc-page-fg))]">Requests awaiting approval</h3>
          <p id="pos-incoming-sr-queue-hint" class="mt-1 text-xs text-[rgb(var(--rc-muted))]"></p>
        </div>
      </div>
      <div
        id="pos-incoming-sr-detail"
        class="mt-4 space-y-3 rounded-xl border border-[rgb(var(--rc-border))] bg-[rgb(var(--rc-surface-2))] p-3 text-sm text-[rgb(var(--rc-page-fg))]"
      ></div>
      <div id="pos-incoming-sr-actions" class="pos-incoming-sr-actions">
        <div id="pos-incoming-sr-step-choice">
          <p class="text-[10px] font-bold uppercase tracking-wider text-[rgb(var(--rc-muted))]">Step 1 — choose an action</p>
          <div class="mt-2 flex flex-wrap gap-2">
            <button
              type="button"
              id="pos-incoming-sr-approve"
              class="btn-rc btn-rc-success inline-flex flex-1 items-center justify-center px-4 py-2.5 text-xs font-bold uppercase tracking-wider"
            >
              Accept
            </button>
            <button
              type="button"
              id="pos-incoming-sr-decline"
              class="btn-rc btn-rc-danger inline-flex flex-1 items-center justify-center px-4 py-2.5 text-xs font-bold uppercase tracking-wider"
            >
              Decline
            </button>
          </div>
        </div>
        <div id="pos-incoming-sr-step-code" class="mt-4 hidden">
          <p class="text-[10px] font-bold uppercase tracking-wider text-[rgb(var(--rc-muted))]">Step 2 — enter your 6-digit code</p>
          <div id="pos-incoming-sr-approve-fields" class="mt-3 hidden space-y-2">
            <label class="block text-[10px] font-bold uppercase tracking-wider text-[rgb(var(--rc-muted))]" for="pos-incoming-sr-qty">Quantity to transfer</label>
            <input
              id="pos-incoming-sr-qty"
              type="number"
              min="0.0001"
              step="any"
              inputmode="decimal"
              class="w-full rounded-xl border border-[rgb(var(--rc-border))] bg-[rgb(var(--rc-surface))] px-3 py-2 text-sm font-semibold tabular-nums text-[rgb(var(--rc-page-fg))] outline-none"
            />
            <p id="pos-incoming-sr-qty-hint" class="text-[11px] text-[rgb(var(--rc-muted))]"></p>
          </div>
          <div id="pos-incoming-sr-delivered-wrap" class="mt-3 hidden space-y-2">
            <label class="block text-[10px] font-bold uppercase tracking-wider text-[rgb(var(--rc-muted))]" for="pos-incoming-sr-delivered-by">Delivered by (optional)</label>
            <input
              id="pos-incoming-sr-delivered-by"
              type="text"
              maxlength="120"
              autocomplete="name"
              placeholder="Leave blank for a manual signature line on the receipt"
              class="w-full rounded-xl border border-[rgb(var(--rc-border))] bg-[rgb(var(--rc-surface))] px-3 py-2 text-sm text-[rgb(var(--rc-page-fg))] outline-none"
            />
          </div>
          <div class="mt-3 space-y-2">
            <label class="block text-[10px] font-bold uppercase tracking-wider text-[rgb(var(--rc-muted))]" for="pos-incoming-sr-code"
              >Manager / admin 6-digit code</label>
            <input
              id="pos-incoming-sr-code"
              type="password"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              pattern="[0-9]{6}"
              placeholder="••••••"
              class="w-full rounded-xl border border-[rgb(var(--rc-border))] bg-[rgb(var(--rc-surface))] px-3 py-2.5 text-sm tracking-[0.2em] text-[rgb(var(--rc-page-fg))] outline-none"
            />
          </div>
          <p id="pos-incoming-sr-err" class="mt-2 hidden text-xs font-semibold text-rose-500"></p>
        </div>
      </div>
      <div class="mt-4">
        <button
          type="button"
          id="pos-incoming-sr-dismiss"
          class="btn-rc btn-rc-ghost w-full px-4 py-2.5 text-xs font-bold uppercase tracking-wider"
        >
          Close
        </button>
      </div>
    </div>
  </div>
</div>
<div
  id="pos-incoming-sr-toast"
  class="pointer-events-none fixed bottom-6 left-1/2 z-[100] hidden max-w-[min(90vw,24rem)] -translate-x-1/2 rounded-2xl border border-[rgb(var(--rc-border))] bg-[rgb(var(--rc-surface))]/95 px-4 py-2.5 text-center text-sm font-semibold text-[rgb(var(--rc-page-fg))] shadow-2xl backdrop-blur-md"
  role="status"
  aria-live="polite"
></div>
<script>
  window.__SHOP_INCOMING_SR = {
    enabled: true,
    shopId: {{ shop.id|int }},
    api: {{ url_for('shop_pos_incoming_stock_requests_json', shop_id=shop.id)|tojson }}
  };
</script>
{% if not skip_incoming_sr_script|default(false) %}
<script defer src="{{ url_for('static', filename='js/pos/pos-incoming-stock.js') }}?v=12"></script>
{% endif %}
{% endif %}
